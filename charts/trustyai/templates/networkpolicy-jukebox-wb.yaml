kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: trustyai-service-jukebox-wb-ingress
  namespace: {{ .Values.name }}-test
spec:
  podSelector:
    matchLabels:
      app: trustyai-service
      app.kubernetes.io/instance: trustyai-service
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4443
      from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - {{ .Values.name }}-hitmusic-wb
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ .Values.name }}-jukebox
  policyTypes:
    - Ingress
